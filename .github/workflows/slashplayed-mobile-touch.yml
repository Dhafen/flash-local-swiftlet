# Experimental unsigned iOS device kit. No Apple or Battle.net secrets.
name: Slashplayed iPhone floating controls
on:
  pull_request:
    paths:
      - .github/workflows/slashplayed-mobile-touch.yml
      - slashplayed/keyboard/**
      - slashplayed/mobile/**
  push:
    branches: [experiment/slashplayed-floating-controls]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-addon-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test combat priorities, cooldowns and touch routing
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -q --no-install-recommends lua5.1
          for file in slashplayed/mobile/addons/SPMobileCombat/*.lua; do luac5.1 -p "$file"; done
          lua5.1 slashplayed/mobile/tests/test_combat.lua slashplayed/mobile/addons
          lua5.1 slashplayed/mobile/tests/test_cooldowns.lua slashplayed/mobile/SpellCooldowns.lua
          lua5.1 slashplayed/mobile/tests/test_phone_layout.lua slashplayed/mobile/PhoneLayout.lua
          cc -Wall -Wextra -Werror -o "$RUNNER_TEMP/touch-zone" slashplayed/mobile/tests/test_touch_zone.c
          "$RUNNER_TEMP/touch-zone"

  keyboard-device-kit:
    runs-on: xcode-27
    timeout-minutes: 85
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      RUSTUP_VERSION: 1.29.2
      RUSTUP_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
      IDEVICE_CACHE_PATHS: |
        work/idevice/BUILD.txt
        work/idevice/include
        work/idevice/ios
        work/idevice/xros
        work/idevice/macos
      SPAPPLE_CACHE_PATHS: |
        work/spapple/ios
        work/spapple/xros
    steps:
      - name: Checkout Slashplayed 1.5.1 source at fixed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulstraw/slashplayed
          ref: 976f9248971238187a82c8c55f69b23054055343
          persist-credentials: false

      - name: Checkout experimental patch from this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .edits
          persist-credentials: false

      - name: Checkout MIT touch implementation from pinned Enhanced commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rollarz/slashplayed-enhanced
          ref: f731434765d724e6f5d91fee2b67b7e6aab45a28
          path: .mobile-source
          persist-credentials: false

      - name: Checkout MIT Forever action bars from pinned Touchbars commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rollarz/Touchbars
          ref: 6ac5bf2e02dba2e2160cf444eef533a4e0118b91
          path: .touchbars
          persist-credentials: false

      - name: Checkout GPL Hekili Forever v0.8.1 at fixed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zmsl/hekili
          ref: 59185f0c4ba8491115c90b3597a970b53fecdeb5
          path: .hekili
          persist-credentials: false

      - name: Stage source and license notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p addon/SPTouchBars
          for ext in toc lua tga; do
            cp ".touchbars/SPTouchBars/SPTouchBars.$ext" "addon/SPTouchBars/SPTouchBars.$ext"
          done
          test -s .mobile-source/LICENSE
          test -s .touchbars/LICENSE

      - name: Apply and verify iPhone controls and Forever addons
        shell: bash
        run: |
          set -euo pipefail
          python3 .edits/slashplayed/keyboard/patch.py shims/appkit/spevent.m
          python3 .edits/slashplayed/mobile/patch.py
          python3 .edits/slashplayed/mobile/best_practice.py
          python3 .edits/slashplayed/mobile/tests/test_staging.py .

      - name: Build prerequisites
        uses: ./.github/actions/companion-deps

      - name: Build unsigned iPhone device kit
        shell: bash
        run: |
          set -euo pipefail
          scripts/fetch-font.sh
          sh apps/companion/bundle-resources.sh --build "$RUNNER_TEMP/keyboard-stage"
          output="$RUNNER_TEMP/slashplayed-mobile-hud-device-kit.zip"
          scripts/release/device-kit.sh "$RUNNER_TEMP/keyboard-stage" "$output"
          python3 .edits/slashplayed/mobile/tests/test_staging.py . "$output"
          delivery="$RUNNER_TEMP/slashplayed-windows-companion-kit"
          mkdir -p "$delivery"
          cp "$output" "$delivery/"
          cp .edits/slashplayed/mobile/INSTALL.md "$delivery/Installera.md"
          (cd "$delivery" && shasum -a 256 slashplayed-mobile-hud-device-kit.zip > SHA256SUMS.txt)

      - name: Upload Windows Companion device kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Slashplayed-iPhone-MobileHUD-Windows-Companion
          path: ${{ runner.temp }}/slashplayed-windows-companion-kit
          retention-days: 30
          if-no-files-found: error
