# Experimental unsigned iOS device kit. No Apple or Battle.net secrets.
name: Slashplayed iPhone mobile touch polish
on:
  pull_request:
    paths:
      - .github/workflows/slashplayed-mobile-touch.yml
      - slashplayed/keyboard/**
      - slashplayed/mobile/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard-device-kit:
    runs-on: xcode-27
    timeout-minutes: 85
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      RUSTUP_VERSION: 1.29.2
      RUSTUP_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
      IDEVICE_CACHE_PATHS: |
        work/idevice/BUILD.txt
        work/idevice/include
        work/idevice/ios
        work/idevice/xros
        work/idevice/macos
      SPAPPLE_CACHE_PATHS: |
        work/spapple/ios
        work/spapple/xros
    steps:
      - name: Checkout Slashplayed 1.5.1 source at fixed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulstraw/slashplayed
          ref: 976f9248971238187a82c8c55f69b23054055343
          persist-credentials: false

      - name: Checkout experimental patch from this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .edits
          persist-credentials: false

      - name: Checkout MIT touch implementation from pinned Enhanced commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rollarz/slashplayed-enhanced
          ref: f731434765d724e6f5d91fee2b67b7e6aab45a28
          path: .mobile-source
          persist-credentials: false

      - name: Checkout MIT Forever action bars from pinned Touchbars commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rollarz/Touchbars
          ref: 6ac5bf2e02dba2e2160cf444eef533a4e0118b91
          path: .touchbars
          persist-credentials: false

      - name: Stage source and license notices
        shell: bash
        run: |
          set -euo pipefail
          cp .mobile-source/shims/appkit/spjoystick.m shims/appkit/spjoystick.m
          mkdir -p addon/SPTouchBars
          for ext in toc lua tga; do
            cp ".touchbars/SPTouchBars/SPTouchBars.$ext" "addon/SPTouchBars/SPTouchBars.$ext"
          done
          test -s .mobile-source/LICENSE
          test -s .touchbars/LICENSE

      - name: Apply iPhone keyboard overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 .edits/slashplayed/keyboard/patch.py shims/appkit/spevent.m
          python3 .edits/slashplayed/mobile/patch.py
          python3 -m py_compile .edits/slashplayed/mobile/polish.py
          python3 .edits/slashplayed/mobile/polish.py
          grep -q 'sp_mobile_toggle_edit' shims/appkit/spevent.m
          grep -q 'sp_mobile_look_speed' shims/appkit/spevent.m
          grep -q 'SPJoystick' shims/appkit/spevent.m
          grep -q 'SPTouchBars' apps/client/spcdn.m
          grep -q 'SPTouchBars' scripts/release/device-kit.sh
          grep -q 'SPSoftKeyboardField' shims/appkit/spevent.m
          grep -q 'sp_toggle_soft_keyboard' shims/appkit/spevent.m

      - name: Build prerequisites
        uses: ./.github/actions/companion-deps

      - name: Build unsigned iPhone device kit
        shell: bash
        run: |
          set -euo pipefail
          scripts/fetch-font.sh
          sh apps/companion/bundle-resources.sh --build "$RUNNER_TEMP/keyboard-stage"
          scripts/release/device-kit.sh "$RUNNER_TEMP/keyboard-stage" "$RUNNER_TEMP/slashplayed-mobile-polish-device-kit.zip"
          unzip -t "$RUNNER_TEMP/slashplayed-mobile-polish-device-kit.zip" >/dev/null
          shasum -a 256 "$RUNNER_TEMP/slashplayed-mobile-polish-device-kit.zip"

      - name: Upload experimental kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Slashplayed-iPhone-MobileTouch-Polish-Kit
          path: ${{ runner.temp }}/slashplayed-mobile-polish-device-kit.zip
          retention-days: 7
          if-no-files-found: error
