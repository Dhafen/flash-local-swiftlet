# Build only free-standing unsigned Slashplayed components. No credentials, no WoW files.
name: Slashplayed Windows installer for iPhone
on:
  pull_request:
    paths:
      - .github/workflows/slashplayed-install.yml
      - .github/workflows/slashplayed-mobile-touch.yml
      - slashplayed/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-kit:
    uses: ./.github/workflows/slashplayed-mobile-touch.yml

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
      PYTHON: python
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep Unix line endings
        run: git config --global core.autocrlf false
      - name: Checkout identical upstream commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulstraw/slashplayed
          ref: 976f9248971238187a82c8c55f69b23054055343
          persist-credentials: false
      - name: Build Windows installer
        run: |
          set -euo pipefail
          (cd apps/companion-rs && rustup toolchain install)
          scripts/build-zsign.sh source
          (cd apps/companion-rs && cargo build --release --locked --target x86_64-pc-windows-msvc)
          apps/companion-rs/package.sh x86_64-pc-windows-msvc "$RUNNER_TEMP/out"
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sp-windows
          path: ${{ runner.temp }}/out/*.zip
          retention-days: 7
          if-no-files-found: error

  combined:
    needs: [device-kit, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout assembly script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sp-windows
          path: downloads/windows
      - name: Fetch patched iPhone kit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Slashplayed-iPhone-Wolkara-Windows-Companion
          path: downloads/phone
      - name: Assemble Windows download
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=slashplayed/mobile python3 slashplayed/mobile/tests/test_windows_bundle.py
          (cd downloads/phone && sha256sum -c SHA256SUMS.txt)
          python3 slashplayed/mobile/assemble_windows_bundle.py \
            downloads/windows/slashplayed-companion-windows-x86_64.zip \
            downloads/phone/slashplayed-wolkara-device-kit.zip \
            Slashplayed-iPhone-Windows.zip downloads/phone/Installera.md \
            downloads/phone/AI_DEVICE_VALIDATION.md downloads/phone/SHA256SUMS.txt
          sha256sum -c SHA256SUMS
      - name: Upload final Windows installer and iPhone kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Slashplayed-iPhone-Windows
          path: |
            Slashplayed-iPhone-Windows.zip
            SHA256SUMS
          retention-days: 7
          if-no-files-found: error
