name: Pixel2Play experimental Core ML export
on:
  workflow_dispatch:
  push:
    branches: [experiment/slashplayed-laya-p2p]
    paths:
      - slashplayed/mobile/pixel2play/**
      - .github/workflows/slashplayed-pixel2play-export.yml
permissions:
  contents: read
jobs:
  export-150m:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install CPU export toolchain
        run: |
          set -euo pipefail
          # Use an available Python supported by both Torch and Core ML Tools.
          PY=""
          for candidate in python3.12 python3.11 python3.10 python3; do
            if command -v "$candidate" >/dev/null && "$candidate" -c 'import sys; assert (3, 10) <= sys.version_info[:2] <= (3, 12)' 2>/dev/null; then
              PY="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$PY" ]; then
            echo "::error::No Python 3.10–3.12 available on the export runner"
            exit 1
          fi
          "$PY" --version
          "$PY" -m venv "$RUNNER_TEMP/p2p"
          "$RUNNER_TEMP/p2p/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/p2p/bin/python" -m pip install 'torch==2.7.0' 'torchvision==0.22.0' 'coremltools==9.0' 'huggingface_hub==0.36.0' 'numpy<2'
      - name: Convert original 150M weights and compare real predictions
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/p2p/bin/python" slashplayed/mobile/pixel2play/export_coreml.py "$RUNNER_TEMP/p2p-model" --frames 4
      - name: Upload only numerically validated experimental packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Pixel2Play-150M-CoreML-experimental
          path: ${{ runner.temp }}/p2p-model
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
